name: Deploy AWS EMA Scanner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-scanner
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest boto3

      - name: Run tests
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: python -m pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_dev_key: ${{ secrets.DEV_KEY }}
      OIDC_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials (OIDC)
        if: env.OIDC_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Configure AWS credentials (legacy static fallback)
        if: env.OIDC_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: |
          cd terraform
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET || 'ema-scanner-tf-state' }}" \
            -backend-config="region=us-east-1"

      - name: Terraform plan
        run: |
          cd terraform
          # Refresh lines print resource ids that contain the AWS account id.
          terraform import aws_cloudwatch_log_group.orchestrator /aws/lambda/ema-scanner-orchestrator 2>&1 | sed -E 's/[0-9]{12}/[account]/g' || true
          terraform import aws_cloudwatch_log_group.worker /aws/lambda/ema-scanner-worker 2>&1 | sed -E 's/[0-9]{12}/[account]/g' || true
          terraform plan -out=tfplan 2>&1 | sed -E 's/[0-9]{12}/[account]/g'

      - name: Terraform apply
        run: |
          cd terraform
          terraform apply -auto-approve tfplan

      - name: Deploy symbols and web dashboard
        run: |
          cd terraform
          BUCKET=$(terraform output -raw bucket_name)
          DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          ORCHESTRATOR_URL=$(terraform output -raw orchestrator_url || echo "")
          ORCHESTRATOR_URL="$ORCHESTRATOR_URL" python3 - <<'PY'
          import os
          from pathlib import Path

          url = os.environ["ORCHESTRATOR_URL"]
          for target in (Path("../web/index.html"), Path("../web/js/app.js")):
              target.write_text(target.read_text(encoding="utf-8").replace("__ORCHESTRATOR_URL__", url), encoding="utf-8")
          PY
          aws s3 cp ../symbols/us-equities.txt "s3://${BUCKET}/symbols/us-equities.txt" --content-type "text/plain"
          aws s3 cp ../web/index.html "s3://${BUCKET}/app/index.html" --content-type "text/html" --cache-control "no-cache"
          aws s3 cp ../web/css "s3://${BUCKET}/css" --recursive --cache-control "max-age=3600"
          aws s3 cp ../web/js "s3://${BUCKET}/js" --recursive --cache-control "max-age=3600"
          # Also upload to app/ prefix just in case they are resolved relative to index.html
          aws s3 cp ../web/css "s3://${BUCKET}/app/css" --recursive --cache-control "max-age=3600"
          aws s3 cp ../web/js "s3://${BUCKET}/app/js" --recursive --cache-control "max-age=3600"
          aws s3 cp ../results/latest-stats.json "s3://${BUCKET}/results/latest-stats.json" --content-type "application/json" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          aws lambda invoke --function-name ema-scanner-orchestrator /tmp/scan-trigger.json || true

